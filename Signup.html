<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Currency Bank - Sign Up</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.app {
  width: 100%;
  max-width: 430px;
  background: linear-gradient(180deg, #031a38, #001127);
  border: 2px solid #4168a5;
  border-radius: 30px;
  padding: 28px 22px;
  color: white;
  box-shadow: 0 0 35px rgba(30,80,150,.25);
}

.back {
  font-size: 30px;
  margin-bottom: 8px;
}

.back a {
  color: white;
  text-decoration: none;
}

.header {
  text-align: center;
  margin-bottom: 22px;
}

.logo {
  width: 95px;
  height: 95px;
  object-fit: cover;
  display: block;
  margin: 0 auto 12px;
  border-radius: 22px;
}

h1 {
  font-size: 20px;
  margin: 8px 0 3px;
}

.subtitle {
  color: #e4b947;
  font-size: 11px;
}

.field {
  margin-bottom: 12px;
}

label {
  display: block;
  color: #aab6c6;
  font-size: 11px;
  margin-bottom: 5px;
}

input {
  width: 100%;
  height: 48px;
  border-radius: 10px;
  border: 1px solid #29496e;
  background: #0b294b;
  color: white;
  padding: 0 13px;
  outline: none;
  font-size: 13px;
}

input:focus {
  border-color: #e4b947;
}

input::placeholder {
  color: #9eabbc;
}

button {
  width: 100%;
  height: 48px;
  border: 0;
  border-radius: 9px;
  background: linear-gradient(#f7d267, #dca32f);
  color: #151515;
  font-weight: 800;
  margin-top: 8px;
  cursor: pointer;
  font-size: 14px;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#message {
  text-align: center;
  font-size: 12px;
  margin-top: 12px;
  min-height: 35px;
  line-height: 18px;
}

.login {
  text-align: center;
  margin-top: 20px;
  color: #9ba8ba;
  font-size: 12px;
}

.login a {
  color: #e6b943;
  text-decoration: none;
  font-weight: bold;
}
</style>

</head>

<body>

<div class="app">

  <div class="back">
    <a href="./index.html">‹</a>
  </div>

  <div class="header">

    <img
      src="./Screenshot_2026-08-17-18-53-58-99.png"
      alt="Global Currency Bank Logo"
      class="logo"
    >

    <h1>Create Account</h1>

    <div class="subtitle">
      Join Global Currency Bank today
    </div>

  </div>


  <div class="field">

    <label>Full Name</label>

    <input
      id="name"
      type="text"
      placeholder="Enter your full name"
      autocomplete="name"
    >

  </div>


  <div class="field">

    <label>Email Address</label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email address"
      autocomplete="email"
    >

  </div>


  <div class="field">

    <label>Phone Number</label>

    <input
      id="phone"
      type="tel"
      placeholder="Enter your phone number"
      autocomplete="tel"
    >

  </div>


  <div class="field">

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Create a password"
      autocomplete="new-password"
    >

  </div>


  <div class="field">

    <label>Confirm Password</label>

    <input
      id="confirmPassword"
      type="password"
      placeholder="Confirm your password"
      autocomplete="new-password"
    >

  </div>


  <button
    id="signupButton"
    type="button"
    onclick="createAccount()"
  >
    Create Account
  </button>


  <div id="message"></div>


  <div class="login">

    Already have an account?

    <a href="./login.html">
      Login
    </a>

  </div>

</div>


<script>

function createAccount() {

  const name =
    document.getElementById("name")
      .value.trim();

  const email =
    document.getElementById("email")
      .value.trim()
      .toLowerCase();

  const phone =
    document.getElementById("phone")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  const confirmPassword =
    document.getElementById("confirmPassword")
      .value;

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("signupButton");


  if (
    !name ||
    !email ||
    !phone ||
    !password ||
    !confirmPassword
  ) {

    message.style.color = "#ff6b6b";

    message.innerText =
      "Please complete all fields.";

    return;
  }


  if (!email.includes("@")) {

    message.style.color = "#ff6b6b";

    message.innerText =
      "Please enter a valid email address.";

    return;
  }


  if (password.length < 8) {

    message.style.color = "#ff6b6b";

    message.innerText =
      "Password must contain at least 8 characters.";

    return;
  }


  if (password !== confirmPassword) {

    message.style.color = "#ff6b6b";

    message.innerText =
      "Passwords do not match.";

    return;
  }


  const existingUser =
    localStorage.getItem(
      "globalCurrencyUser"
    );


  if (existingUser) {

    const user =
      JSON.parse(existingUser);

    if (
      user.email.toLowerCase() === email
    ) {

      message.style.color = "#ff6b6b";

      message.innerText =
        "An account with this email already exists.";

      return;
    }
  }


  /*
    DEMO ACCOUNT STORAGE

    This is for a local prototype only.
    Do not use this approach for a real
    banking application.
  */

  const user = {

    name: name,

    email: email,

    phone: phone,

    password: password

  };


  localStorage.setItem(
    "globalCurrencyUser",
    JSON.stringify(user)
  );


  localStorage.setItem(
    "accountVerified",
    "true"
  );


  message.style.color =
    "#00dcae";

  message.innerText =
    "Account created successfully!";


  button.disabled = true;


  setTimeout(function() {

    window.location.href =
      "./login.html";

  }, 1000);

}

</script>

</body>
</html>
