<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GlobalBank - Digital Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body { background: #0B0E14; color: #EAECEF; font-family: Inter, sans-serif; }
    .gradient-text { background: linear-gradient(90deg, #00D4AA 0%, #00A8FF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: #1A1F2E; border: 1px solid #2B3139; }
    .btn-primary { background: linear-gradient(90deg, #00D4AA 0%, #00A8FF 100%); color: black; }
    .hidden { display: none; }
  </style>
</head>
<body class="min-h-screen">

  <!-- AUTH + OTP FORMS SAME AS BEFORE -->
  <div id="auth" class="flex items-center justify-center px-4 min-h-screen">
    <div id="signupForm" class="card p-8 rounded-2xl w-full max-w-md">
      <h1 class="text-3xl font-bold text-center mb-2 gradient-text">GlobalBank</h1>
      <input id="signupEmail" type="email" placeholder="Email" class="w-full bg-gray-800 p-3 rounded-lg mb-3">
      <input id="signupPhone" type="tel" placeholder="Phone" class="w-full bg-gray-800 p-3 rounded-lg mb-3">
      <input id="signupPin" type="password" placeholder="Set 4-Digit Transaction PIN" maxlength="4" class="w-full bg-gray-800 p-3 rounded-lg mb-3">
      <button id="signupBtn" class="btn-primary w-full py-3 rounded-lg font-bold mb-3">Sign Up</button>
      <p class="text-center text-sm"><span id="showLogin" class="text-[#00D4AA] cursor-pointer">Login</span></p>
    </div>

    <div id="loginForm" class="card p-8 rounded-2xl w-full max-w-md hidden">
      <h1 class="text-3xl font-bold text-center mb-2 gradient-text">GlobalBank</h1>
      <input id="loginEmail" type="email" placeholder="Email" class="w-full bg-gray-800 p-3 rounded-lg mb-3">
      <button id="loginBtn" class="btn-primary w-full py-3 rounded-lg font-bold mb-3">Send Login Code</button>
      <p class="text-center text-sm"><span id="showSignup" class="text-[#00D4AA] cursor-pointer">Sign Up</span></p>
    </div>

    <div id="otpForm" class="card p-8 rounded-2xl w-full max-w-md hidden">
      <h2 class="text-2xl font-bold text-center mb-4">Enter Login Code</h2>
      <input id="otpInput" type="text" maxlength="6" class="w-full bg-gray-800 p-3 rounded-lg mb-3 text-center text-2xl">
      <button id="verifyBtn" class="btn-primary w-full py-3 rounded-lg font-bold">Verify</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden p-4 max-w-6xl mx-auto">
    <div class="flex justify-between mb-6">
      <h1 class="text-3xl font-bold gradient-text">GlobalBank</h1>
      <button id="logoutBtn" class="text-red-400">Logout</button>
    </div>
    
    <div class="card p-6 rounded-2xl mb-6 bg-gradient-to-r from-[#00D4AA] to-[#00A8FF] text-black">
      <p>Available Balance</p>
      <h2 class="text-4xl font-bold"><span id="currencySymbol">₦</span><span id="balance">0.00</span></h2>
    </div>

    <button id="sendMoneyBtn" class="card p-4 rounded-xl w-full mb-3">💸 Send Money</button>
    <button id="supportBtn" class="card p-4 rounded-xl w-full mb-3">💬 Chat Support</button>

    <!-- TRANSACTION PIN MODAL -->
    <div id="pinModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center">
      <div class="card p-6 rounded-2xl w-80">
        <h3 class="font-bold mb-3">Enter Transaction PIN</h3>
        <input id="pinInput" type="password" maxlength="4" class="w-full bg-gray-800 p-3 rounded-lg mb-3 text-center">
        <button id="confirmPinBtn" class="btn-primary w-full py-2 rounded-lg">Confirm</button>
      </div>
    </div>

    <!-- SUPPORT CHAT MODAL -->
    <div id="chatModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center">
      <div class="card p-6 rounded-2xl w-96">
        <h3 class="font-bold mb-3">Support Chat</h3>
        <div id="chatBox" class="h-40 overflow-y-auto bg-gray-900 p-2 rounded mb-3 text-sm"></div>
        <input id="chatInput" placeholder="Describe your issue..." class="w-full bg-gray-800 p-2 rounded-lg mb-2">
        <button id="sendChatBtn" class="btn-primary w-full py-2 rounded-lg">Send</button>
        <button onclick="document.getElementById('chatModal').classList.add('hidden')" class="w-full mt-2 text-gray-400">Close</button>
      </div>
    </div>
  </div>
  
<script>
document.addEventListener('DOMContentLoaded', function() {
  let generatedOTP = ""; let currentUser = {};
  emailjs.init("7H-20VEn5wiKfWzl"); 
  const SERVICE_ID = "service_j557oql"; const TEMPLATE_ID = "template_qeoiqtj";

  function getUsers() { return JSON.parse(localStorage.getItem('globalbank_users') || '[]'); }
  function saveUsers(users) { localStorage.setItem('globalbank_users', JSON.stringify(users)); }
  function generateOTP() { return Math.floor(100000 + Math.random() * 900000); }

  // SIGNUP WITH PIN
  document.getElementById('signupBtn').onclick = async () => {
    const email = document.getElementById('signupEmail').value;
    const phone = document.getElementById('signupPhone').value;
    const pin = document.getElementById('signupPin').value;
    let users = getUsers();
    if(users.find(u => u.email === email)) return alert("Account exists. Login");
    if(pin.length !== 4) return alert("PIN must be 4 digits");
    
    currentUser = {email, phone, pin, balance: 1000}; // give 1000 for testing
    generatedOTP = generateOTP();
    await emailjs.send(SERVICE_ID, TEMPLATE_ID, {to_email: email, otp_code: generatedOTP});
    document.getElementById('signupForm').classList.add('hidden');
    document.getElementById('otpForm').classList.remove('hidden');
  }

  // LOGIN
  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('loginEmail').value;
    let user = getUsers().find(u => u.email === email);
    if(!user) return alert("No account. Sign Up first");
    currentUser = user;
    generatedOTP = generateOTP();
    await emailjs.send(SERVICE_ID, TEMPLATE_ID, {to_email: email, otp_code: generatedOTP});
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('otpForm').classList.remove('hidden');
  }

  // VERIFY
  document.getElementById('verifyBtn').onclick = () => {
    if(document.getElementById('otpInput').value != generatedOTP) return alert("Wrong code");
    let users = getUsers();
    if(!users.find(u => u.email === currentUser.email)) { users.push(currentUser); saveUsers(users); }
    showDashboard();
  }

  function showDashboard() {
    document.getElementById('auth').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('balance').innerText = currentUser.balance.toFixed(2);
  }

  // TRANSACTION PIN CHECK
  document.getElementById('sendMoneyBtn').onclick = () => {
    document.getElementById('pinModal').classList.remove('hidden');
  }
  document.getElementById('confirmPinBtn').onclick = () => {
    if(document.getElementById('pinInput').value == currentUser.pin) {
      alert("✅ Transaction Approved");
      currentUser.balance -= 100; // demo debit
      saveUsers(getUsers().map(u => u.email === currentUser.email ? currentUser : u));
      document.getElementById('balance').innerText = currentUser.balance.toFixed(2);
    } else alert("❌ Wrong Transaction PIN");
    document.getElementById('pinModal').classList.add('hidden');
  }

  // SUPPORT CHAT
  document.getElementById('supportBtn').onclick = () => {
    document.getElementById('chatModal').classList.remove('hidden');
  }
  document.getElementById('sendChatBtn').onclick = () => {
    let msg = document.getElementById('chatInput').value;
    if(!msg) return;
    document.getElementById('chatBox').innerHTML += `<p><b>You:</b> ${msg}</p>`;
    document.getElementById('chatBox').innerHTML += `<p><b>Support:</b> We got your issue. Will check your debit/credit</p>`;
    document.getElementById('chatInput').value = "";
  }

  document.getElementById('logoutBtn').onclick = () => location.reload();
});
</script>
</body>
  </html>
