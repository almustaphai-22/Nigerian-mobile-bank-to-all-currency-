<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NairaGlobal - Verify</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00D4AA">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body { background: #0B0E14; color: #EAECEF; font-family: Inter, sans-serif; }
    .gradient-text { background: linear-gradient(90deg, #00D4AA 0%, #00A8FF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: #1A1F2E; border: 1px solid #2B3139; }
    .btn-primary { background: linear-gradient(90deg, #00D4AA 0%, #00A8FF 100%); }
    .hidden { display: none; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

  <!-- STEP 1 -->
  <div id="step1" class="card p-8 rounded-2xl w-full max-w-md">
    <h1 class="text-3xl font-bold text-center mb-6 gradient-text">NairaGlobal</h1>
    <input id="email" type="email" placeholder="Email" class="w-full bg-gray-800 p-3 rounded-lg mb-3 border border-gray-700" required>
    <input id="phone" type="tel" placeholder="Phone 080xxxxxxxx" class="w-full bg-gray-800 p-3 rounded-lg mb-3 border-gray-700" required>
    <button onclick="sendOTP()" class="btn-primary w-full text-black py-3 rounded-lg font-bold">Send Verification Code</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="card p-8 rounded-2xl w-full max-w-md hidden">
    <h2 class="text-2xl font-bold text-center mb-4">Enter 6-Digit Code</h2>
    <p class="text-gray-400 text-center mb-4">Check your Email</p>
    <input id="otpInput" type="text" placeholder="123456" maxlength="6" class="w-full bg-gray-800 p-3 rounded-lg mb-3 border-gray-700 text-center text-2xl">
    <button onclick="verifyOTP()" class="btn-primary w-full text-black py-3 rounded-lg font-bold">Verify</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden w-full max-w-4xl p-4">
    <div class="card p-6 rounded-2xl mb-6 text-center">
      <h2 class="text-2xl font-bold">✅ Verified</h2>
      <p class="text-gray-400">Your NGN Account: <span id="accountNumber" class="font-bold text-xl text-[#00D4AA]"></span></p>
      <a id="gumroadLink" href="PASTE_YOUR_GUMROAD_LINK_HERE" target="_blank" class="btn-primary text-black px-8 py-3 rounded-lg font-bold mt-4 inline-block">Pay $1 to Unlock</a>
    </div>
  </div>
  
<script>
  let generatedOTP = "";
  let userData = {};

  // ✅ YOUR KEYS CONNECTED
  emailjs.init("7H-20VEnSwiKFhwzI"); 
  const SERVICE_ID = "service_j557oql";
  const TEMPLATE_ID = "template_qeoiqtj";
  const TERMII_API_KEY = "PASTE_TERMII_KEY_HERE"; // Add later

  function generateOTP() {
    return Math.floor(100000 + Math.random() * 900000);
  }

  function generateAccNumber(phone) {
    let clean = phone.replace(/\D/g,''); 
    return "810" + clean.slice(-7); 
  }

  async function sendOTP() {
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    
    if(!email || !phone) {
      alert("Please enter Email and Phone");
      return;
    }

    generatedOTP = generateOTP();
    userData = {email, phone};

    // SEND REAL EMAIL NOW
    emailjs.send(SERVICE_ID, TEMPLATE_ID, {
      to_email: email,
      otp_code: generatedOTP
    }).then(() => {
      alert("Code sent to " + email + ". Check inbox + spam");
    }).catch(err => {
      alert("Email failed. Check EmailJS Dashboard > Activity");
      console.log(err);
    });

    // Show step 2
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
  }

  function verifyOTP() {
    const entered = document.getElementById('otpInput').value;
    if(entered == generatedOTP) {
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('accountNumber').innerText = generateAccNumber(userData.phone);
    } else {
      alert("Wrong code. Try again.");
    }
  }

  // Register Service Worker for PWA Install
  if ('serviceWorker' in navigator) { 
    navigator.serviceWorker.register('sw.js'); 
  }
</script>
</body>
</html>
