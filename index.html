.logo {

}
.currencies {

}
.welcome {
  color: #aab6c6;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 30px;
}
.button {
  display: block;
  width: 100%;
  height: 52px;
  line-height: 52px;
