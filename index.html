<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Currency Bank</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.app {
  width: 100%;
  max-width: 430px;
  background: linear-gradient(180deg, #031a38, #001127);
  border: 2px solid #4168a5;
  border-radius: 30px;
  padding: 40px 25px;
  color: white;
  text-align: center;
  box-shadow: 0 0 35px rgba(30,100,180,.3);
}

.logo {
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 25px;
  display: block;
  margin: 0 auto 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,.5);
}

h1 {
  font-size: 27px;
  margin: 5px 0;
}

.subtitle {
  color: #e4b947;
  font-size: 13px;
  margin-bottom: 35px;
}

.welcome {
  color: #aab6c6;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 30px;
}

.button {
  display: block;
  width: 100%;
  height: 52px;
  line-height: 52px;
  border-radius: 11px;
  text-decoration: none;
  font-weight: bold;
  font-size: 15px;
  margin-top: 14px;
}

.login-button {
  background: linear-gradient(#f7d267, #dca32f);
  color: #111;
}

.signup-button {
  border: 1px solid #4168a5;
  background: #0b294b;
  color: white;
}

.button:active {
  transform: scale(.98);
}

.security {
  margin-top: 28px;
  color: #65758a;
  font-size: 10px;
}
</style>
</head>

<body>

<div class="app">

  <img
    src="Screenshot_2026-08-17-18-53-58-99.png"
    class="logo"
    alt="Global Currency Bank Logo"
  >

  <h1>Global Currency Bank</h1>

  <div class="subtitle">
    Banking Beyond Borders
  </div>

  <div class="welcome">
    Welcome to Global Currency Bank.<br>
    Secure access to your currency account.
  </div>

  <!-- LOGIN -->
  <a href="login.html" class="button login-button">
    Login
  </a>

  <!-- CREATE ACCOUNT -->
  <a href="signup.html" class="button signup-button">
    Create Account
  </a>

  <div class="security">
    🔒 Secure account access
  </div>

</div>

</body>
</html>
