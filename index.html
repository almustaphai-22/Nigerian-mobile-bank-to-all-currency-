<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Global Currency Bank - Login</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;
  min-height: 100vh;

  background: #000;

  font-family: Arial, sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 15px;
}

.app {

  width: 100%;
  max-width: 430px;

  background:
    linear-gradient(
      180deg,
      #031a38,
      #001127
    );

  border: 2px solid #4168a5;

  border-radius: 30px;

  padding: 30px 22px;

  color: white;

  box-shadow:
    0 0 30px rgba(30,100,180,.25);
}

.header {

  text-align: center;

  margin-bottom: 28px;
}

.logo {

  width: 95px;
  height: 95px;

  border-radius: 22px;

  object-fit: cover;

  margin-bottom: 10px;
}

h1 {

  font-size: 24px;

  margin: 5px 0;
}

.subtitle {

  color: #e4b947;

  font-size: 12px;
}

.welcome {

  margin-bottom: 20px;
}

.welcome h2 {

  margin-bottom: 5px;

  font-size: 20px;
}

.welcome p {

  color: #9ba8ba;

  font-size: 13px;
}

.field {

  margin-bottom: 15px;
}

label {

  display: block;

  color: #aab6c6;

  font-size: 12px;

  margin-bottom: 6px;
}

input {

  width: 100%;

  height: 50px;

  border-radius: 11px;

  border: 1px solid #29496e;

  background: #0b294b;

  color: white;

  padding: 0 14px;

  outline: none;

  font-size: 14px;
}

input:focus {

  border-color: #e6bd50;
}

.forgot {

  text-align: right;

  margin-top: -5px;

  margin-bottom: 15px;
}

.forgot a {

  color: #e6bd50;

  text-decoration: none;

  font-size: 12px;
}

button {

  width: 100%;

  height: 50px;

  border: 0;

  border-radius: 10px;

  background:
    linear-gradient(
      #f7d267,
      #dca32f
    );

  color: #111;

  font-size: 16px;

  font-weight: 800;

  cursor: pointer;
}

#message {

  text-align: center;

  font-size: 13px;

  margin-top: 15px;
}

.divider {

  display: flex;

  align-items: center;

  gap: 10px;

  margin: 25px 0;

  color: #718096;

  font-size: 12px;
}

.divider::before,
.divider::after {

  content: "";

  flex: 1;

  height: 1px;

  background: #183657;
}

.signup {

  text-align: center;

  color: #9ba8ba;

  font-size: 13px;
}

.signup a {

  color: #e6bd50;

  text-decoration: none;

  font-weight: bold;
}

.security {

  text-align: center;

  margin-top: 22px;

  color: #65758a;

  font-size: 10px;
}

</style>

</head>

<body>

<div class="app">

  <div class="header">

    <!-- YOUR GLOBAL CURRENCY BANK LOGO -->
    <img
      src="logo.png"
      class="logo"
      alt="Global Currency Bank"
    >

    <h1>Global Currency Bank</h1>

    <div class="subtitle">
      Banking Beyond Borders
    </div>

  </div>


  <div class="welcome">

    <h2>Welcome Back</h2>

    <p>
      Login to access your account
    </p>

  </div>


  <div class="field">

    <label>
      Email Address
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
    >

  </div>


  <div class="field">

    <label>
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
    >

  </div>


  <div class="forgot">

    <a href="forgot-password.html">
      Forgot Password?
    </a>

  </div>


  <button onclick="login()">
    Login
  </button>


  <div id="message"></div>


  <div class="divider">
    or
  </div>


  <div class="signup">

    Don't have an account?

    <a href="signup.html">
      Sign Up
    </a>

  </div>


  <div class="security">
    🔒 Your account information is protected
  </div>

</div>


<script>

function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();

  const password =
    document
      .getElementById("password")
      .value;

  const message =
    document.getElementById("message");


  if (!email || !password) {

    message.style.color = "#ff6b6b";

    message.innerText =
      "Please enter your email and password.";

    return;

  }


  /*
    GET SAVED ACCOUNT
  */

  const savedUser =
    JSON.parse(
      localStorage.getItem(
        "globalCurrencyUser"
      )
    );


  if (!savedUser) {

    message.style.color = "#ff6b6b";

    message.innerText =
      "No account found. Please sign up first.";

    return;

  }


  if (
    email !==
    savedUser.email.toLowerCase()
  ) {

    message.style.color = "#ff6b6b";

    message.innerText =
      "Email address not found.";

    return;

  }


  /*
    For this prototype, account verification
    is required before login.
  */

  if (
    localStorage.getItem(
      "accountVerified"
    ) !== "true"
  ) {

    message.style.color = "#ff6b6b";

    message.innerText =
      "Please verify your account first.";

    return;

  }


  /*
    LOGIN SUCCESS
  */

  localStorage.setItem(
    "loggedIn",
    "true"
  );


  message.style.color = "#00dcae";

  message.innerText =
    "Login successful. Opening your account...";


  setTimeout(function() {

    window.location.href =
      "dashboard.html";

  }, 800);

}

</script>

</body>
</html>
