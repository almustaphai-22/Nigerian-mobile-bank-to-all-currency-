<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Currency Bank - Login</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: #000;
  color: white;
  font-family: "Segoe UI", Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
}

.app {
  width: 100%;
  max-width: 430px;
  min-height: 780px;
  background:
    radial-gradient(circle at 50% 15%, rgba(24, 73, 145, .35), transparent 35%),
    linear-gradient(180deg, #031a38 0%, #02152d 55%, #001126 100%);
  border: 1px solid #355c9d;
  border-radius: 32px;
  padding: 30px 24px 25px;
  box-shadow:
    0 0 35px rgba(31, 91, 170, .25),
    inset 0 0 40px rgba(0, 0, 0, .25);
  position: relative;
  overflow: hidden;
}

/* Top navigation */
.top {
  display: flex;
  align-items: center;
  height: 35px;
  margin-bottom: 22px;
}

.back {
  font-size: 30px;
  color: white;
  cursor: pointer;
  font-weight: 300;
}

/* Logo */
.logo-area {
  text-align: center;
  margin-top: 5px;
  margin-bottom: 34px;
}

.logo {
  width: 105px;
  height: 105px;
  object-fit: cover;
  border-radius: 25px;
  margin-bottom: 12px;
  filter: drop-shadow(0 8px 15px rgba(0,0,0,.45));
}

.bank-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -.3px;
}

.tagline {
  color: #e5b94c;
  font-size: 12px;
  margin-top: 4px;
  letter-spacing: .3px;
}

/* Welcome */
.welcome {
  margin-bottom: 22px;
}

.welcome h2 {
  font-size: 19px;
  margin-bottom: 7px;
}

.welcome p {
  font-size: 13px;
  color: #9daaba;
}

/* Input */
.input-box {
  height: 57px;
  width: 100%;
  background: rgba(13, 42, 76, .75);
  border: 1px solid rgba(76, 119, 171, .32);
  border-radius: 11px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  padding: 0 13px;
  transition: .2s;
}

.input-box:focus-within {
  border-color: #dcae3c;
  box-shadow: 0 0 0 2px rgba(220,174,60,.08);
}

.icon {
  width: 26px;
  font-size: 19px;
  color: #e2b844;
  margin-right: 8px;
  text-align: center;
}

.input-box input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 13px;
}

.input-box input::placeholder {
  color: #f0f0f0;
  opacity: .9;
}

.input-box small {
  position: absolute;
  margin-top: -31px;
  margin-left: 34px;
  font-size: 10px;
  color: #d5dbe4;
}

/* Password eye */
.eye {
  color: #8c98a9;
  cursor: pointer;
  font-size: 17px;
}

/* Forgot */
.forgot {
  text-align: right;
  margin: 3px 4px 20px;
}

.forgot a {
  color: #e6bd50;
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
}

/* Main button */
.login-btn {
  width: 100%;
  height: 48px;
  border: none;
  border-radius: 9px;
  background: linear-gradient(180deg, #f7ce63, #d99e27);
  color: #151515;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(218, 166, 51, .15);
}

.login-btn:active {
  transform: scale(.98);
}

/* Message */
#message {
  text-align: center;
  font-size: 12px;
  margin-top: 10px;
  min-height: 16px;
}

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #8b98a9;
  font-size: 11px;
  margin: 20px 0 13px;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  flex: 1;
  background: rgba(104, 130, 162, .25);
}

/* Social buttons */
.social {
  display: flex;
  gap: 10px;
}

.social-btn {
  height: 42px;
  flex: 1;
  border: 1px solid rgba(89, 119, 154, .45);
  background: rgba(3, 22, 43, .7);
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
}

.google {
  font-weight: 700;
  font-size: 18px;
}

.apple {
  font-size: 18px;
}

/* Sign up */
.signup {
  text-align: center;
  margin-top: 25px;
  font-size: 12px;
  color: #9da8b7;
}

.signup a {
  color: #e6bd50;
  text-decoration: none;
  font-weight: 700;
}

/* Bottom safe area */
.bottom-line {
  width: 105px;
  height: 4px;
  background: white;
  border-radius: 10px;
  position: absolute;
  bottom: 9px;
  left: 50%;
  transform: translateX(-50%);
}

/* Small screens */
@media (max-width: 450px) {
  .app {
    min-height: 760px;
    border-radius: 28px;
    padding-left: 21px;
    padding-right: 21px;
  }
}

@media (max-height: 700px) {
  body {
    align-items: flex-start;
  }

  .app {
    min-height: 700px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- Back -->
  <div class="top">
    <div class="back" onclick="history.back()">‹</div>
  </div>

  <!-- Logo and Bank Name -->
  <div class="logo-area">

    <!-- Your uploaded logo -->
    <img src="logo.png"
         alt="Global Currency Bank Logo"
         class="logo">

    <div class="bank-name">
      Global Currency Bank
    </div>

    <div class="tagline">
      Banking Beyond Borders
    </div>

  </div>

  <!-- Welcome -->
  <div class="welcome">
    <h2>Welcome Back</h2>
    <p>Login to access your account</p>
  </div>

  <!-- Email / Phone -->
  <div class="input-box">
    <div class="icon">✉</div>

    <input
      type="text"
      id="loginInput"
      placeholder="Email or phone number"
      autocomplete="username"
    >
  </div>

  <!-- Password -->
  <div class="input-box">

    <div class="icon">♙</div>

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <div class="eye" onclick="togglePassword()">
      ◉
    </div>

  </div>

  <!-- Forgot Password -->
  <div class="forgot">
    <a href="forgot-password.html">
      Forgot Password?
    </a>
  </div>

  <!-- Login -->
  <button class="login-btn" onclick="login()">
    Login
  </button>

  <div id="message"></div>

  <!-- Divider -->
  <div class="divider">
    or continue with
  </div>

  <!-- Social Login -->
  <div class="social">

    <button class="social-btn" onclick="googleLogin()">
      <span class="google">G</span>
      Google
    </button>

    <button class="social-btn" onclick="appleLogin()">
      <span class="apple">●</span>
      Apple
    </button>

  </div>

  <!-- Sign Up -->
  <div class="signup">
    Don't have an account?
    <a href="signup.html">Sign Up</a>
  </div>

  <div class="bottom-line"></div>

</div>


<script>

function togglePassword() {

  const password =
    document.getElementById("password");

  if (password.type === "password") {
    password.type = "text";
  } else {
    password.type = "password";
  }
}


function login() {

  const loginInput =
    document.getElementById("loginInput").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  if (loginInput === "" || password === "") {

    message.style.color = "#ff6b6b";
    message.innerText =
      "Please enter your email/phone and password.";

    return;
  }

  /*
    DEMO LOGIN ONLY

    A real banking application must authenticate
    through a secure server/backend.
  */

  message.style.color = "#e6bd50";
  message.innerText = "Signing you in...";

  setTimeout(function() {

    window.location.href = "dashboard.html";

  }, 1000);
}


function googleLogin() {

  const message =
    document.getElementById("message");

  message.style.color = "#e6bd50";
  message.innerText =
    "Google login will be connected to your backend.";
}


function appleLogin() {

  const message =
    document.getElementById("message");

  message.style.color = "#e6bd50";
  message.innerText =
    "Apple login will be connected to your backend.";
}

</script>

</body>
  </html>
