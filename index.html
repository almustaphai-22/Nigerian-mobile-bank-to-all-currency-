<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Currency Bank - FX & Transfers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { 
      background: #0a0a0a; 
      color: #fff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #1a1a1a;
      padding: 30px 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.1);
    }
    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, #00ffc8, #00aaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .currencies {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      background: #2a2a2a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input::placeholder { color: #777; }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #00ffc8, #00aaff);
      color: #000;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover { transform: scale(1.02); opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #message { margin-top: 15px; text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="logo">All Currency Bank</h1>
    <p class="currencies">USD • EUR • GBP • CAD • NGN • AED</p>

    <input type="email" id="email" placeholder="Email" required>
    <input type="tel" id="phone" placeholder="Phone 080xxxxxxxx" required>

    <button class="btn" id="sendCodeBtn" onclick="sendCode()">Send Verification Code</button>
    
    <p id="message"></p>
  </div>

  <script>
    function sendCode() {
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const btn = document.getElementById('sendCodeBtn');
      const msg = document.getElementById('message');

      if(email === '' || phone === '') {
        msg.style.color = 'red';
        msg.innerText = 'Please fill Email and Phone';
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Sending...';
      msg.style.color = '#00ffc8';
      msg.innerText = 'Sending code...';

      // TODO: Connect this to EmailJS here
      // emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {email: email, phone: phone})

      setTimeout(() => {
        msg.innerText = 'Code sent! Check your email/SMS';
        btn.disabled = false;
        btn.innerText = 'Send Verification Code';
      }, 2000);
    }
  </script>
</body>
</html>
