<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Code - All Currency Bank</title>
<style>
  body{background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial}
  .box{background:#0a1a33;padding:30px;border-radius:20px;width:90%;max-width:400px;text-align:center;border:1px solid #1a3d73}
  .logo{width:70px;margin-bottom:15px}
  h2{margin-bottom:8px}
  .sub{color:#8aa4c7;font-size:13px;margin-bottom:25px}
  .code-inputs{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
  .code-inputs input{width:45px;height:50px;text-align:center;font-size:22px;border-radius:10px;border:1px solid #1a3d73;background:#020a1a;color:#fff}
  .btn{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(90deg,#f7d267,#dca32f);color:#000;font-weight:700;font-size:16px;cursor:pointer}
  .resend{color:#00aaff;font-size:12px;margin-top:15px;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <img src="Screenshot_2026-08-17-18-53-58-99.png" class="logo">
    <h2>Verify Your Email</h2>
    <p class="sub">We sent a 6-digit code to <span id="userEmail"></span></p>
    
    <div class="code-inputs">
      <input maxlength="1"><input maxlength="1"><input maxlength="1">
      <input maxlength="1"><input maxlength="1"><input maxlength="1">
    </div>
    
    <button class="btn" onclick="verifyCode()">Verify & Continue</button>
    <p class="resend" onclick="resendCode()">Didn't get code? Resend</p>
    <p id="msg" style="margin-top:10px"></p>
  </div>

<script>
  // Show which email we sent to
  document.getElementById('userEmail').innerText = localStorage.getItem('userEmail') || 'your email';
  
  // Auto jump to next input
  document.querySelectorAll('.code-inputs input').forEach((input, i, arr) => {
    input.addEventListener('input', () => { if(input.value && i < 5) arr[i+1].focus(); })
  });
  
  function verifyCode(){
    const code = [...document.querySelectorAll('.code-inputs input')].map(i => i.value).join('');
    const realCode = localStorage.getItem('verificationCode');
    const msg = document.getElementById('msg');
    
    if(code === realCode){
      msg.style.color = '#00ff88';
      msg.innerText = 'Verified! Redirecting...';
      setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);
    } else {
      msg.style.color = 'red';
      msg.innerText = 'Wrong code. Please try again';
    }
  }
  
  function resendCode(){ alert('New code sent!'); generateCode(); }
  
  // For demo: generate code. Later we will use EmailJS
  function generateCode(){
    const code = Math.floor(100000 + Math.random() * 900000);
    localStorage.setItem('verificationCode', code);
    console.log("Your Code:", code); // Remove this later. For testing only
    alert("Demo Code: " + code); // Remove this later
  }
  generateCode(); // Generate on page load
</script>
</body>
</html>
