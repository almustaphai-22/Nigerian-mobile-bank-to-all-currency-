<!DOCTYPE html><html><head><title>Settings</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{background:#020a1a;color:#fff;font-family:Arial;padding:20px;padding-bottom:120px} h2{margin-bottom:20px} .item{padding:15px;background:#0a1a33;border-radius:10px;margin-bottom:10px;cursor:pointer} .item:active{background:#12254d} .logout{color:red}</style>
</head><body>
<h2>Settings</h2>
<div class="item">👤 Profile: <span id="userName"></span></div>
<div class="item">🔒 Security</div>
<div class="item">❓ Help & Support</div>
<div class="item logout" onclick="logout()">🚪 Logout</div>
<script>
document.getElementById('userName').innerText = localStorage.getItem('userName') || 'User';
function logout(){
  localStorage.clear(); 
  window.location.href = 'index.html'; // Back to welcome page
}
</script>
</body></html>
